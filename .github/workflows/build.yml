name: Пересборка каталога

# Ночной запуск тянет Google-таблицу и собирает сайт.
# arts.txt и photos/ он не переписывает: их присылает дилерский портал
# (workflow «Зеркало витрины» в almaly-dealers). Коммит ниже с [skip ci]
# не запускает сборку повторно и ничего не отправляет обратно на портал.

on:
  push:
    paths: ["photos/**", "arts.txt", "build.py", "config.json"]
  schedule:
    - cron: "0 4 * * *"        # ежедневно тянем свежие остатки из таблицы
  workflow_dispatch:

concurrency: build-catalog

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pillow qrcode
      - run: python sync_sheet.py
      - run: python build.py
      - name: Закоммитить сайт
        run: |
          git config user.name "almaly-bot"
          git config user.email "actions@github.com"
          git add docs qr
          git diff --cached --quiet && exit 0
          git commit -m "Пересборка каталога [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
