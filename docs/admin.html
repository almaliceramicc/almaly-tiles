<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Редактор медиа — Алмалы-Керамик</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230c0e10'/><path d='M50 20 66 50 50 80 34 50z' fill='%23c9a227'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  [hidden]{display:none!important}
  body{overflow-y:scroll}
  .layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:26px;
    max-width:var(--max);margin:0 auto;padding:22px 24px 60px;align-items:start}

  /* вход */
  .gate{max-width:560px;margin:70px auto;padding:0 24px;text-align:center}
  .gate h1{font-size:34px;margin:0 0 10px}
  .gate p{color:var(--dim);font-size:14px;margin:0 0 22px}
  .gate input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--tx);
    padding:13px 15px;border-radius:12px;font:15px var(--sans);margin-bottom:12px}
  .gate a{color:var(--accent)}

  /* список моделей */
  .side-list{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;position:sticky;top:84px;max-height:calc(100vh - 110px);display:flex;flex-direction:column;gap:10px}
  .side-list input[type=search]{width:100%;min-width:0}
  .side-scroll{overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin:-4px;padding:4px}
  .item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer;
    border:1px solid transparent;text-align:left;background:none;color:inherit;font:inherit;width:100%}
  .item:hover{background:var(--panel2)}
  .item[aria-current=true]{border-color:var(--accent);background:var(--accent-soft)}
  .item img,.item .noimg{width:42px;height:42px;border-radius:8px;object-fit:cover;flex:none;background:#101316}
  .item .noimg{display:flex;align-items:center;justify-content:center;color:#565c63;font-size:16px}
  .item b{display:block;font-weight:500;font-size:14px;line-height:1.25}
  .item small{color:var(--dim);font-size:11.5px;font-family:ui-monospace,Menlo,monospace}
  .item .cnt{margin-left:auto;color:var(--dim);font-size:12px}

  /* рабочая область */
  .work{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px 26px;min-height:60vh}
  .work-hd{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
  .work-hd h2{margin:0;font-size:30px;line-height:1.15}
  .work-hd .art{margin-top:6px}
  .work-hd .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .btn{background:var(--panel2);border:1px solid var(--line2);color:var(--tx);padding:10px 16px;
    border-radius:11px;font:14px var(--sans);cursor:pointer;transition:.2s}
  .btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#191919;font-weight:600}
  .btn.primary:hover:not(:disabled){background:#d8ae2c;color:#191919}
  .btn:disabled{opacity:.45;cursor:default}
  .hint{color:var(--dim);font-size:13px;margin:14px 0 0}

  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:20px}
  .shot{position:relative;border-radius:12px;overflow:hidden;background:#101316;border:2px solid transparent;
    touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;transition:border-color .2s}
  .shot .img-wrap{position:relative;display:block}
  .shot img{width:100%;aspect-ratio:3/4;object-fit:cover;pointer-events:none}
  .shot.cover{border-color:var(--accent)}
  .shot.dragging{cursor:grabbing;opacity:.9;pointer-events:none;z-index:5;
    box-shadow:0 16px 36px rgba(0,0,0,.6);transform-origin:center}
  .shot .num{position:absolute;top:8px;left:8px;background:rgba(12,14,16,.82);border-radius:7px;
    padding:2px 8px;font-size:12px;color:var(--tx)}
  .shot.cover .num{background:var(--accent);color:#191919;font-weight:600}
  .shot .acts{position:absolute;right:8px;top:8px;display:flex;gap:6px;opacity:0;transition:.2s}
  .shot:hover .acts,.shot:focus-within .acts{opacity:1}
  @media(hover:none){.shot .acts{opacity:1}}
  .icon{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:rgba(12,14,16,.86);
    color:var(--tx);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .icon:hover{border-color:var(--accent);color:var(--accent)}
  .shot.gone{opacity:.28}
  .shot.gone .img-wrap::after{content:"удалено";position:absolute;inset:auto 0 0 0;text-align:center;
    background:rgba(12,14,16,.8);font-size:12px;padding:4px}

  .drop{order:99;border:2px dashed var(--line2);border-radius:12px;display:flex;flex-direction:column;gap:6px;
    align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:13px;
    cursor:pointer;padding:16px;aspect-ratio:3/4;transition:.2s}
  .drop:hover,.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .drop b{font-size:22px;font-weight:400}

  .bar{position:sticky;bottom:0;margin-top:22px;padding:14px 0 0;border-top:1px solid var(--line);
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel)}
  .bar .status{color:var(--dim);font-size:13px}
  .bar .right{margin-left:auto;display:flex;gap:10px}
  .dirty{color:var(--accent)}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1b1f23;
    border:1px solid var(--line2);border-radius:12px;padding:12px 20px;font-size:14px;z-index:60;
    box-shadow:0 14px 34px rgba(0,0,0,.5);display:none;max-width:90vw}
  #toast.err{border-color:#8c4a4a;color:#ffb4b4}
  @media(max-width:900px){.layout{grid-template-columns:1fr;gap:14px;padding:14px 16px 50px}
    .side-list{position:static;max-height:44vh}.work{padding:18px 14px 22px}
    .shots{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
    .work-hd h2{font-size:24px}}
</style>

<header><div class="wrap head">
  <a class="logo" href="index.html">Алмалы<span>·</span>Керамик</a>
  <span class="sub">Редактор медиа</span>
  <a class="navlink" href="index.html">Каталог</a>
  <button class="navlink" id="logout" hidden>Выйти</button>
</div></header>

<section class="gate" id="gate">
  <h1>Вход в редактор</h1>
  <p>Нужен GitHub-токен с правом записи в репозиторий <b>almaly-tiles</b>. Он сохранится в этом браузере
     и больше спрашиваться не будет.</p>
  <input type="password" id="token" placeholder="ghp_… или github_pat_…" autocomplete="off">
  <button class="btn primary" id="login">Войти</button>
  <p class="hint"><a href="https://github.com/settings/tokens/new?scopes=repo&description=Almaly%20tiles%20editor"
     target="_blank">Создать токен →</a></p>
</section>

<div class="layout" id="app" hidden>
  <aside class="side-list">
    <input type="search" id="q" placeholder="Поиск модели или артикула" aria-label="Поиск">
    <div class="side-scroll" id="list"></div>
  </aside>
  <main class="work" id="work"></main>
</div>

<div id="toast"></div>

<script src="dnd.js"></script>
<script>
const REPO = 'almaliceramicc/almaly-tiles', BRANCH = 'main';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let token = localStorage.getItem('gh_token') || '';
let tiles = [];              // каталог из data.json
let repoFiles = {};          // {арт: [{f, sha}]} — что сейчас лежит в GitHub
let current = null;          // выбранный артикул
let draft = [];              // рабочий список фото выбранной модели
let saving = false;

/* ---------- GitHub ---------- */
const HINTS = {
  401: 'токен недействителен или отозван — нажми «Выйти» и вставь новый',
  403: 'у токена нет права записи (Contents: Read and write / scope repo)',
  404: 'токен не видит репозиторий — дай ему доступ к almaly-tiles',
};

async function gh(path, opts = {}) {
  const fresh = path + (path.includes('?') ? '&' : '?') + 't=' + Date.now();   // без кэша GitHub отдаёт старую ветку
  const r = await fetch(`https://api.github.com/repos/${REPO}${fresh}`, {...opts, cache: 'no-store',
    headers: {Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', ...opts.headers}});
  const d = r.status === 204 ? {} : await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(HINTS[r.status] || d.message || `код ${r.status}`); e.status = r.status; throw e; }
  return d;
}

/** Один коммит из набора операций; при гонке с автосборкой повторяем на свежей голове. */
const sleep = ms => new Promise(r => setTimeout(r, ms));

/** Ветку могла сдвинуть автосборка — пробуем несколько раз на свежей голове. */
async function commit(message, ops) {
  for (const wait of [0, 900, 2500, 5000]) {
    if (wait) await sleep(wait);
    try { return await commitOnce(message, ops); }
    catch (e) {
      const race = [409, 422].includes(e.status) || /fast forward/i.test(e.message);
      if (!race || wait === 5000) throw e;
    }
  }
}
async function commitOnce(message, ops) {
  const head = (await gh(`/git/refs/heads/${BRANCH}`)).object.sha;
  const baseTree = (await gh(`/git/commits/${head}`)).tree.sha;
  const tree = ops.map(o => ({path: o.path, mode: '100644', type: 'blob', sha: o.sha ?? null}));
  const t = await gh('/git/trees', {method: 'POST', body: JSON.stringify({base_tree: baseTree, tree})});
  const c = await gh('/git/commits', {method: 'POST',
    body: JSON.stringify({message, tree: t.sha, parents: [head]})});
  await gh(`/git/refs/heads/${BRANCH}`, {method: 'PATCH', body: JSON.stringify({sha: c.sha})});
}

async function loadRepoFiles() {
  const tree = await gh(`/git/trees/${BRANCH}?recursive=1`);
  repoFiles = {};
  tree.tree.filter(x => x.type === 'blob' && x.path.startsWith('photos/'))
    .forEach(x => { const [, art, f] = x.path.split('/'); (repoFiles[art] ||= []).push({f, sha: x.sha}); });
  Object.values(repoFiles).forEach(a => a.sort((x, y) => x.f.localeCompare(y.f)));
}

const rawUrl = (art, f, sha) =>
  `https://raw.githubusercontent.com/${REPO}/${BRANCH}/photos/${art}/${f}?v=${(sha || '').slice(0, 8)}`;

/* ---------- вспомогательное ---------- */
const toast = (text, isErr) => {
  const t = $('#toast');
  t.textContent = text; t.className = isErr ? 'err' : ''; t.style.display = text ? 'block' : 'none';
  clearTimeout(toast.t);
  if (text) toast.t = setTimeout(() => t.style.display = 'none', isErr ? 8000 : 3500);
};

/** Ужимает файл до 1600 px и возвращает {base64, preview}. */
const shrink = file => new Promise((res, rej) => {
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', .85);
    res({content: url.split(',')[1], preview: url});
  };
  img.onerror = () => rej(new Error(`не удалось прочитать ${file.name}`));
  img.src = URL.createObjectURL(file);
});

const dirty = () => {
  const was = (repoFiles[current] || []).map(p => p.f).join();
  const now = draft.filter(p => !p.deleted).map(p => p.f || '+').join();
  return was !== now || draft.some(p => p.deleted || !p.f);
};

/* ---------- список моделей ---------- */
function drawList() {
  const s = $('#q').value.trim().toLowerCase();
  const list = tiles.filter(t => !s || (t.name + ' ' + t.art).toLowerCase().includes(s));
  $('#list').innerHTML = list.map(t => {
    const ph = repoFiles[t.art] || [];
    return `<button class="item" data-art="${t.art}" aria-current="${t.art === current}">
      ${ph.length ? `<img src="${rawUrl(t.art, ph[0].f, ph[0].sha)}" alt="" loading="lazy">`
                  : '<span class="noimg">◇</span>'}
      <span><b>${esc(t.name)}</b><small>${t.format} см · ${esc(t.surface)}</small></span>
      <span class="cnt">${ph.length || '—'}</span>
    </button>`;
  }).join('') || '<p class="meta" style="padding:8px">Ничего не найдено</p>';
}

/* ---------- рабочая область ---------- */
function drawWork() {
  const t = tiles.find(x => x.art === current);
  const work = $('#work');
  if (!t) { work.innerHTML = '<p class="hint">Выбери модель слева, чтобы редактировать её фотографии.</p>'; return; }

  const shots = draft.map((p, i) => {
    const src = p.preview || rawUrl(t.art, p.f, p.sha);
    const visible = draft.filter(x => !x.deleted).indexOf(p) + 1;
    return `<div class="shot ${p.deleted ? 'gone' : ''} ${visible === 1 && !p.deleted ? 'cover' : ''}"
                 data-f="${p.id}" title="Перетащи, чтобы поменять порядок">
      <div class="img-wrap"><img src="${src}" alt="" loading="lazy" draggable="false"></div>
      <span class="num">${p.deleted ? '—' : (visible === 1 ? 'обложка' : visible)}</span>
      <span class="acts">
        ${p.deleted
          ? `<button class="icon" data-act="undo" data-i="${i}" title="Вернуть">↺</button>`
          : `<button class="icon" data-act="cover" data-i="${i}" title="Сделать обложкой">★</button>
             <button class="icon" data-act="del" data-i="${i}" title="Удалить">✕</button>`}
      </span>
    </div>`;
  }).join('');

  work.innerHTML = `
    <div class="work-hd">
      <div>
        <h2>${esc(t.name)}</h2>
        <div class="art">${t.format} см · ${esc(t.surface)}</div>
      </div>
      <div class="right">
        <a class="btn" href="tile.html?a=${t.art}" target="_blank">Открыть на сайте ↗</a>
      </div>
    </div>
    <p class="hint">Перетаскивай фото мышью или пальцем — первое становится обложкой. ★ — сразу в обложку,
       ✕ — удалить. Изменения применяются на сайте после кнопки «Сохранить».</p>
    <div class="shots" id="shots" data-art="${t.art}">
      ${shots}
      <label class="drop"><b>＋</b>добавить фото<input type="file" accept="image/*" multiple hidden></label>
    </div>
    <div class="bar">
      <span class="status ${dirty() ? 'dirty' : ''}" id="status">
        ${dirty() ? 'Есть несохранённые изменения' : 'Всё сохранено'}</span>
      <span class="right">
        <button class="btn" id="reset" ${dirty() ? '' : 'disabled'}>Отменить</button>
        <button class="btn primary" id="save" ${dirty() ? '' : 'disabled'}>Сохранить</button>
      </span>
    </div>`;
}

function select(art) {
  if (dirty() && !confirm('Есть несохранённые изменения. Перейти к другой модели и потерять их?')) return;
  current = art;
  draft = (repoFiles[art] || []).map(p => ({...p, id: p.f}));
  drawList(); drawWork();
  if (innerWidth < 900) $('#work').scrollIntoView({behavior: 'smooth', block: 'start'});
}

/* ---------- сохранение ---------- */
async function save() {
  if (saving) return;
  const art = current, keep = draft.filter(p => !p.deleted);
  saving = true; $('#save').disabled = true; $('#status').textContent = 'Сохраняю…';
  try {
    const ops = (repoFiles[art] || []).map(p => ({path: `photos/${art}/${p.f}`}));   // без sha = удалить
    for (const [i, p] of keep.entries()) {
      let sha = p.sha;
      if (!sha) {
        const blob = await gh('/git/blobs', {method: 'POST',
          body: JSON.stringify({content: p.content, encoding: 'base64'})});
        sha = blob.sha;
      }
      ops.push({path: `photos/${art}/${String(i + 1).padStart(2, '0')}.jpg`, sha});
    }
    await commit(`Фото ${art}: ${keep.length} шт.`, ops);
    await loadRepoFiles();
    draft = (repoFiles[art] || []).map(p => ({...p, id: p.f}));
    drawList(); drawWork();
    toast('Сохранено. Сайт обновится через 1–2 минуты.');
  } catch (e) {
    toast('Не сохранилось: ' + e.message, true);
    drawWork();
  } finally { saving = false; }
}

/* ---------- события ---------- */
$('#list').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (b) select(b.dataset.art);
});
$('#q').addEventListener('input', drawList);

$('#work').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act], #save, #reset');
  if (!b) return;
  if (b.id === 'save') return save();
  if (b.id === 'reset') { draft = (repoFiles[current] || []).map(p => ({...p, id: p.f})); return drawWork(); }
  const i = +b.dataset.i, p = draft[i];
  if (b.dataset.act === 'del') p.deleted = true;
  if (b.dataset.act === 'undo') delete p.deleted;
  if (b.dataset.act === 'cover') { draft.splice(i, 1); draft.unshift(p); }
  drawWork();
});

$('#work').addEventListener('change', async e => {
  if (e.target.type !== 'file' || !e.target.files.length) return;
  await addFiles(e.target.files);
});

async function addFiles(files) {
  toast(`Готовлю ${files.length} фото…`);
  try {
    for (const file of files) {
      const {content, preview} = await shrink(file);
      draft.push({id: 'new-' + Math.random().toString(36).slice(2), content, preview});
    }
    drawWork();
    toast('Добавлено. Не забудь «Сохранить».');
  } catch (e) { toast(e.message, true); }
}

/* перетаскивание файлов в любое место рабочей области */
$('#work').addEventListener('dragover', e => {
  if (!current) return;
  e.preventDefault(); e.target.closest('.drop')?.classList.add('over');
});
$('#work').addEventListener('dragleave', e => e.target.closest('.drop')?.classList.remove('over'));
$('#work').addEventListener('drop', e => {
  if (!current || !e.dataTransfer.files.length) return;
  e.preventDefault(); e.target.closest('.drop')?.classList.remove('over');
  addFiles(e.dataTransfer.files);
});

enableDnd($('#work'), (art, order) => {
  draft.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));   // удалённые уедут в конец
  drawWork();
});

window.addEventListener('beforeunload', e => { if (dirty()) e.preventDefault(); });

/* ---------- вход ---------- */
async function start() {
  try {
    const repo = await gh('');
    if (repo.permissions && !repo.permissions.push)
      throw new Error('у токена только чтение — нужен доступ на запись');
    tiles = (await fetch('data.json', {cache: 'no-cache'}).then(r => r.json())).tiles;
    await loadRepoFiles();
    $('#gate').hidden = true; $('#app').hidden = false; $('#logout').hidden = false;
    drawList(); drawWork();
    const a = new URLSearchParams(location.search).get('a');
    if (a && tiles.some(t => t.art === a)) select(a);
  } catch (e) {
    $('#gate').hidden = false; $('#app').hidden = true;
    toast('Вход не удался: ' + e.message, true);
  }
}

$('#login').addEventListener('click', () => {
  token = $('#token').value.trim();
  if (!token) return toast('Вставь токен', true);
  localStorage.setItem('gh_token', token); start();
});
$('#token').addEventListener('keydown', e => e.key === 'Enter' && $('#login').click());
$('#logout').addEventListener('click', () => { localStorage.removeItem('gh_token'); location.reload(); });
if (token) start();
</script>
